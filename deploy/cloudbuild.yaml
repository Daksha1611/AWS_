# Builds the image with the demo token baked into the console bundle.
# The token is public by design: it gates writes so a crawler cannot drain a
# shared free tier, and it ships inside a page anyone can read.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VITE_DEMO_TOKEN=${_TOKEN}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
