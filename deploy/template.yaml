AWSTemplateFormatVersion: '2010-09-09'

# Pocket Change on AWS.
#
# HONEST STATUS: this template has never been deployed, and there is no AWS
# account behind this machine to validate it against - not even
# `aws cloudformation validate-template`, which needs credentials this
# environment does not have. Read it as a design document that happens to be
# executable, the same status the Lambda version this replaces carried.
#
# It targets App Runner, not Lambda. HACKATHON.md and TODO.md both say why:
# the funnel keeps running on a background thread AFTER `POST /runs` has
# already answered, and Lambda freezes execution the instant the response
# returns - the tree would simply stop growing wherever it had reached, with
# no error. `/stream` is Server-Sent Events, which API Gateway does not do
# comfortably either. App Runner is a container, always-on, and is on the
# hackathon's own Ship It service list.
#
# App Runner needs an image already pushed before this stack can reference
# it - there is no `sam build`-equivalent that builds from source inline, so
# the checklist in deploy/README.md (build, tag, `aws ecr push`) comes first
# and `ImageIdentifier` below is that image's URI, not a default.
#
# No SAM transform: nothing here is a SAM resource type, so a plain
# `aws cloudformation deploy` needs no transform and no SAM CLI.

Description: >
  Bounded, revocable spending authority for AI agents - the ledger table, the
  root signing key's secret, the App Runner service, and IAM scoped tightly
  enough that "bounded" describes the infrastructure and not just the tokens.

Parameters:
  ImageIdentifier:
    Type: String
    Description: >
      The image App Runner pulls, e.g.
      <account>.dkr.ecr.<region>.amazonaws.com/pocketchange:v1. Built and
      pushed by hand first - see deploy/README.md §2.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-opus-5
    Description: The buyer's reasoning model.
  BedrockJudgeModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5
    Description: >
      The monitor. Deliberately the smallest tier: it is the trusted
      component of an AI-control arrangement and answers one narrow question.
  KeySecretName:
    Type: String
    Default: pocketchange/root-key
    Description: >
      Name (not ARN) of the Secrets Manager secret holding the Ed25519 root
      key - see pocketchange/secrets.py. Never created here: the service
      mints it on its own first cold start via a get-or-create, the same
      shape as the DynamoDB table's create_table_if_absent(). Naming it here
      only lets the IAM policy below scope to it before it exists.
  DemoToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      POCKETCHANGE_DEMO_TOKEN. A brake against a crawler draining a shared
      model quota, not authentication - deploy/README.md §2 says so plainly.
      Left blank, the gate is off.
  EnableBedrock:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Whether this account can actually call Bedrock. Defaults to false
      because AWS's Free Plan does not include Bedrock at all, and the
      failure mode of getting this wrong is the worse one: an instance role
      always resolves credentials, so boto3 answers "yes, Bedrock is
      available", the decomposer and monitor try real calls, and the run
      dies partway instead of degrading. False sets
      POCKETCHANGE_NO_BEDROCK=1 - checked before boto3 is consulted at all -
      so /status reports `"model": false` honestly and the deterministic
      decomposer runs instead. It also drops the Bedrock grant from the
      instance role, because a permission that cannot be exercised should
      not be handed out.

Conditions:
  HasDemoToken: !Not [!Equals [!Ref DemoToken, '']]
  BedrockEnabled: !Equals [!Ref EnableBedrock, 'true']

Resources:

  # One table, composite key. See pocketchange/dynamo.py for the item layout
  # and why `available_paise` is stored rather than derived.
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        # This is a ledger. The cost of being able to answer "what did it say
        # last Tuesday" is far below the cost of not being able to.
        PointInTimeRecoveryEnabled: true

  # Pulls the image App Runner runs. A separate role from the one below on
  # purpose - AWS's own split between "who may fetch the container" and "what
  # the container may do once running", and conflating them would hand the
  # running service ECR-pull permissions it never needs at runtime.
  ECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # What the running gateway is actually allowed to touch. Every statement
  # below is scoped to one resource this stack itself creates or names - no
  # `Resource: "*"` anywhere, which is the property this whole project argues
  # infrastructure should have and not just tokens.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pocketchange-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt LedgerTable.Arn
        # Omitted entirely when EnableBedrock is false - see that parameter.
        - !If
          - BedrockEnabled
          - PolicyName: pocketchange-bedrock
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Scoped to the two model ids this project actually calls,
                # never `bedrock:InvokeModel` on `*`.
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource:
                    - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
                    - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockJudgeModelId}
          - !Ref AWS::NoValue
        - PolicyName: pocketchange-root-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The `-*` suffix is not a wildcard grant, it is how you name a
              # secret you know the NAME of before its ARN exists - Secrets
              # Manager appends a random 6-character suffix at creation, and
              # this is AWS's own documented pattern for referencing it
              # anyway. CreateSecret only ever succeeds for the FIRST instance
              # racing to mint the key (pocketchange/secrets.py handles losing
              # that race); every instance after it only ever calls
              # GetSecretValue.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:CreateSecret
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KeySecretName}-*

  GatewayService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: pocketchange
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt ECRAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              POCKETCHANGE_DDB_TABLE: !Ref LedgerTable
              POCKETCHANGE_BEDROCK_MODEL: !Ref BedrockModelId
              POCKETCHANGE_BEDROCK_JUDGE_MODEL: !Ref BedrockJudgeModelId
              # The switch that closes the "credentials resolve, so Bedrock
              # must be available" trap - checked before boto3 is consulted.
              POCKETCHANGE_NO_BEDROCK: !If [BedrockEnabled, !Ref AWS::NoValue, '1']
              POCKETCHANGE_KEY_SECRET_NAME: !Ref KeySecretName
              AWS_REGION: !Ref AWS::Region
              # A dotenv file baked into a deployment artefact is a credential
              # in a registry. Everything here arrives as a real environment
              # variable instead.
              POCKETCHANGE_NO_DOTENV: '1'
              POCKETCHANGE_DEMO_TOKEN: !If [HasDemoToken, !Ref DemoToken, !Ref AWS::NoValue]
        AutoDeploymentsEnabled: false
      InstanceConfiguration:
        Cpu: '1024'   # 1 vCPU
        Memory: '2048'  # 2 GB - TODO.md's own sizing
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        # /healthz on purpose, not /status: this is App Runner's own liveness
        # probe and needs a fast, dependency-free 200 every time, which is
        # exactly what test_health_reports_fake_rail pins down. /status
        # answers a different question - "which layers are actually live" -
        # and TODO.md §4 already says to check that one by hand after a
        # deploy, not wire it into the thing that decides whether to keep the
        # instance running.
        Protocol: HTTP
        Path: /healthz
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  GatewayUrl:
    Description: >
      One URL for both the API and the console - the Dockerfile builds them
      into the same image, so there is no CORS to configure.
    Value: !GetAtt GatewayService.ServiceUrl
  LedgerTableName:
    Description: The DynamoDB table holding mandates, reservations and the book.
    Value: !Ref LedgerTable
  RootKeySecretName:
    Description: >
      The Secrets Manager secret name the service will create on its own
      first boot - not created by this stack. Nothing to read until then.
    Value: !Ref KeySecretName
